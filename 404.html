<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Thierry Stoll</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 24px;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--orange);
      opacity: .15;
      user-select: none;
    }
    .error-content {
      margin-top: -60px;
    }
    .error-content h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      margin: 0 0 12px;
    }
    .error-content p {
      color: var(--muted);
      font-size: 1rem;
      margin: 0 0 32px;
    }
  </style>
</head>
<body>
  <div class="motion-bg" aria-hidden="true"></div>

  <main class="error-page">
    <div class="error-code" aria-hidden="true">404</div>
    <div class="error-content">
      <p class="eyebrow">Oops</p>
      <h1>Wrong altitude.</h1>
      <p>This page doesn't exist — maybe the thermals took it.</p>
      <a class="btn secondary" href="/">↑ Back to the top</a>
    </div>
  </main>
</body>
</html>
